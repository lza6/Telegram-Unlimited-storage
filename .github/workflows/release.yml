name: Web and Headless Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-release-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Match tag to package metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const tag = process.env.TAG_NAME;
          const expected = tag.startsWith('v') ? tag.slice(1) : '';
          const values = {
            'app/package.json': JSON.parse(fs.readFileSync('app/package.json', 'utf8')).version,
            'app/src-tauri/Cargo.toml': (fs.readFileSync('app/src-tauri/Cargo.toml', 'utf8')
              .match(/^version\s*=\s*"([^"]+)"/m) || [])[1],
            'app/src-tauri/tauri.conf.json': JSON.parse(
              fs.readFileSync('app/src-tauri/tauri.conf.json', 'utf8'),
            ).version,
          };
          const mismatches = Object.entries(values)
            .filter(([, version]) => version !== expected)
            .map(([path, version]) => path + '=' + (version || '<missing>'));

          if (!expected || mismatches.length > 0) {
            console.error('Release tag ' + tag + ' must equal v<version> in all release metadata.');
            console.error(mismatches.join(', '));
            process.exit(1);
          }
          console.log('Release metadata matches ' + tag + '.');
          NODE

  quality:
    name: Quality gate
    needs: validate-release-version
    uses: ./.github/workflows/docker-api.yml
    permissions:
      contents: read

  create-release:
    name: Create prerelease notes
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create Chinese Web/Headless release
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const body = [
              `## Telegram Drive ${tag}`,
              '',
              '本发布线的交付面是 `deploy/web` 控制台与 Rust Headless API。',
              '',
              '### 已包含',
              '- Midnight Relay 深色 Web 控制台、响应式布局、键盘导航与上传反馈。',
              '- Headless API 上传准入、Redis 失效关闭语义与持久调度租约保护。',
              '- Rust/前端定向测试与构建证据记录在仓库文档中。',
              '',
              '### 已知边界',
              '- 真实 PostgreSQL、Redis 多副本和 Telegram 生产路径不由本地质量门替代。',
              '- Tauri 桌面壳保留为兼容代码，不属于本发布线的交付承诺。',
              '- Docker 镜像只在受保护的 `main` 推送流水线发布，本标签不会自动发布镜像。',
              '- 若需要生产部署，请先完成真实凭据、容量、备份恢复和故障演练。',
              '',
              '### 验证建议',
              '- 先查看 Actions 中同一 SHA 的质量门结果。',
              '- 按 `README-DOCKER.md` 配置环境变量后再进行受控冒烟验证。',
            ].join('\n');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Telegram Drive ${tag}`,
              body,
              draft: false,
              prerelease: true,
            });
