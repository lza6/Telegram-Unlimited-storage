[package]
name = "app"
version = "4.0.0-beta"
description = "Turn your Telegram account into an unlimited, secure cloud storage drive. an Open-source desktop app built with Tauri, Rust, and React."
authors = ["Cameron Amer"]
edition = "2021"



[lib]

name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "d07f96f", features = ["proxy"] }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "d07f96f", features = ["proxy"] }
grammers-tl-types = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
tokio = { version = "1", features = ["full"] }

tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2"
chrono = "0.4"
base64 = "0.21"
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = "2.9.0"
actix-web = "4"
actix-cors = "0.7"
futures = "0.3"
async-stream = "0.3"
actix-rt = "2"
tauri-plugin-process = "2.3.1"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
sqlite = "0.37.0"
actix-files = "0.6"
actix-multipart = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
urlencoding = "2"
redis = { version = "0.27", default-features = false, features = ["script"] }
tokio-postgres = "0.7"
r2d2 = "0.8"
actix-ws = "0.3"
parking_lot = "0.12"
async-trait = "0.1"
tempfile = "3"

[[bin]]
name = "app"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "telegram-drive-server"
path = "src/bin/telegram-drive-server.rs"
required-features = ["headless-server"]

[features]
default = ["desktop"]
desktop = []
headless-server = []
