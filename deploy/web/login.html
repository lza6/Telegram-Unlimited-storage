<html lang="zh-CN">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Telegram Drive 管理登录 — 使用 ACCESS_PWD 访问控制台与 API 服务。" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/logo.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Telegram Drive" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="登录 · Telegram Drive API" />
  <meta property="og:description" content="Telegram Drive 管理登录 — 使用 ACCESS_PWD 访问控制台与 API 服务。" />
  <meta property="og:url" content="" data-td-og-url />
  <meta property="og:image" content="" data-td-og-image />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="登录 · Telegram Drive API" />
  <meta name="twitter:description" content="Telegram Drive 管理登录 — 使用 ACCESS_PWD 访问控制台与 API 服务。" />
  <link rel="canonical" href="" data-td-canonical data-td-path="/login.html" />
  <script src="/assets/page-meta.js"></script>
  <title>登录 · Telegram Drive API</title>

  <link rel="stylesheet" href="/assets/admin.css" />
  <script src="/assets/theme.js"></script>

</head>

<body class="page-center login-page">

  <a class="skip-link" href="#main-content">跳到登录表单</a>

  <div class="login-shell">
    <section class="login-brand" aria-labelledby="product-title">
      <p class="login-kicker">Midnight Relay</p>
      <h1 id="product-title">Telegram<br />Drive</h1>
      <p class="login-copy">把 Telegram 连接成清晰、可靠的文件中继站。管理上传、文件、分享与服务状态，不暴露真实 Telegram 凭据。</p>
    </section>

    <main id="main-content" class="card login-card" tabindex="-1">
      <p class="eyebrow">安全访问</p>
      <h2>进入控制台</h2>
      <p class="login-meta">使用服务端配置的管理密码。它仅用于访问本控制台，与 Telegram API 凭据无关。</p>

      <form id="login-form" novalidate>

      <label for="username-input" class="sr-only">账号</label>

      <input

        id="username-input"

        type="text"

        name="username"

        value="admin"

        autocomplete="username"

        class="sr-only"

        tabindex="-1"

        aria-hidden="true"

      />

      <div class="field-stack">
        <label for="pwd-input">管理密码 <span class="muted">ACCESS_PWD</span></label>
        <div class="input-row">

        <input

          id="pwd-input"

          type="password"

          name="pwd"

          required

          autocomplete="current-password"

          aria-describedby="err"

          aria-invalid="false"

        />

          <button type="button" id="toggle-pwd" class="btn-icon btn-secondary" aria-label="显示密码" aria-pressed="false">显示</button>
        </div>
      </div>

      <button type="submit" id="submit-btn">

        <span class="btn-label">进入控制台</span>

        <span class="btn-spinner hidden" aria-hidden="true"></span>

      </button>

      </form>

      <p id="err" class="error hidden" role="alert" aria-live="assertive"></p>
      <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

      <nav class="links login-footer" aria-label="相关页面">
        <a href="/docs.html">API 文档</a>
        <a href="/login.html?next=/telegram.html">绑定 Telegram</a>
        <a href="/login.html?next=/upload.html">兼容上传入口</a>
      </nav>

      <button type="button" id="theme-toggle" class="btn-secondary" style="width: auto; min-width: 0; margin-top: 16px;" aria-label="切换主题">
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle-label" style="margin-left: 6px;">暗色模式</span>
      </button>
    </main>
  </div>

  <script src="/assets/web-pure.js"></script>
  <script src="/assets/login.js"></script>

</body>

</html>
