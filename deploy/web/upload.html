<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>上传页 · Telegram Drive API</title>
  <meta name="description" content="Telegram Drive 公共上传页 — 分片上传、进度轮询与文件夹选择。" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/logo.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Telegram Drive" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="上传页 · Telegram Drive API" />
  <meta property="og:description" content="Telegram Drive 公共上传页 — 分片上传、进度轮询与文件夹选择。" />
  <meta property="og:url" content="" data-td-og-url />
  <meta property="og:image" content="" data-td-og-image />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="上传页 · Telegram Drive API" />
  <meta name="twitter:description" content="Telegram Drive 公共上传页 — 分片上传、进度轮询与文件夹选择。" />
  <link rel="canonical" href="" data-td-canonical data-td-path="/upload.html" />
  <script src="/assets/page-meta.js"></script>
  <link rel="stylesheet" href="/assets/admin.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand-lockup" href="/dashboard.html" aria-label="Telegram Drive 控制台首页">
        <span>Telegram Drive</span>
      </a>
      <nav class="sidebar-nav sidebar-nav-spaced" aria-label="主导航">
        <a href="/dashboard.html" data-nav="dashboard">概览 & 上传</a>
        <a href="/files.html" data-nav="files">文件列表</a>
        <a href="/shares.html" data-nav="shares">分享管理</a>
        <a href="/settings.html" data-nav="settings">服务设置</a>
        <a href="/upload.html" data-nav="upload">上传页 (tg-disk)</a>
        <a href="/docs.html" data-nav="docs">API 文档</a>
        <a href="/telegram.html" data-nav="telegram">Telegram 登录</a>
        <button type="button" id="logout-btn" class="btn-secondary sidebar-logout">退出登录</button>
      </nav>
      <p class="muted sidebar-footnote">tg-disk 兼容上传入口，与控制台共用分片逻辑。</p>
    </aside>
    <main id="main-content" class="content" tabindex="-1">
      <header class="page-header page-header--compact">
        <div class="page-header-copy">
          <p class="eyebrow">Compatible transfer</p>
          <h2>Telegram Cloud Storage</h2>
          <p class="page-subtitle">兼容 tg-disk 的分片上传入口，适合脚本与临时传输任务。</p>
        </div>
      </header>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

      <div class="status-rail"><span id="tg-dot" class="status-dot bad" aria-hidden="true"></span><strong id="tg-status">检测中…</strong><span class="muted" id="api-health"></span></div>
      <div id="service-banner" class="service-banner service-banner--upload" hidden role="alert" aria-live="assertive"></div>

      <div class="toolbar upload-toolbar">
        <label for="upload-folder" class="toolbar-label">目标文件夹</label>
        <select id="upload-folder" class="toolbar-input toolbar-select">
          <option value="">Saved Messages（默认）</option>
        </select>
      </div>

      <button type="button" class="drop-zone drop-zone--compact" id="drop" aria-controls="file-input" aria-describedby="upload-hint">
        <p class="drop-title">拖拽文件到此处，或点击选择</p>
        <p class="drop-hint" id="upload-hint">支持任意格式，自动分片处理大文件</p>
      </button>
      <input type="file" id="file-input" multiple hidden />

      <div class="stats" id="stats" hidden aria-live="polite">
        <div class="stat-item"><span class="stat-value" id="file-count">0</span><span class="stat-label">待上传文件</span></div>
        <div class="stat-item"><span class="stat-value" id="total-size">0</span><span class="stat-label">总大小</span></div>
        <div class="stat-item"><span class="stat-value conn-status conn-disconnected" id="conn-status">未连接</span><span class="stat-label">进度连接</span></div>
      </div>

      <div id="file-list" aria-live="polite" aria-relevant="additions text"></div>
      <button type="button" id="upload-btn" class="upload-btn" disabled>开始上传</button>
      <p id="retry-status" class="muted hidden" role="status" aria-live="polite"></p>
    </main>
  </div>

  <div id="result-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="result-modal-title" aria-hidden="true" hidden>
    <div class="modal-content">
      <h3 class="modal-title" id="result-modal-title">上传成功</h3>
      <p class="muted">文件已存储到 Telegram，以下是下载链接</p>
      <div id="result-links" role="status" aria-live="polite"></div>
      <button type="button" id="close-modal" class="btn-secondary">关闭</button>
    </div>
  </div>

  <script src="/assets/api-client.js"></script>
  <script src="/assets/web-pure.js"></script>
  <script src="/assets/page-readiness.js"></script>
  <script src="/assets/share-domain.js"></script>
  <script src="/assets/upload-folder.js"></script>
  <script src="/assets/upload-core.js"></script>
  <script>
    if (TdApi.requireLogin()) {
    TdApi.initSidebar('upload');
    window.showToast = TdApi.showToast;

    async function refreshStatus() {
      await TdPageReadiness.refreshUploadReadiness({ bannerPrefix: '上传暂不可用：', folderSelectSelector: '#upload-folder' });
    }
    refreshStatus();
    setInterval(refreshStatus, 60000);

    TdUploadFolder.populateFolderSelect(document.getElementById('upload-folder'));

    TdUpload.initChunkedUpload({
      dropSelector: '#drop',
      inputSelector: '#file-input',
      listSelector: '#file-list',
      uploadBtnSelector: '#upload-btn',
      folderSelectSelector: '#upload-folder',
      statsSelector: '#stats',
      fileCountSelector: '#file-count',
      totalSizeSelector: '#total-size',
      modalSelector: '#result-modal',
      resultLinksSelector: '#result-links',
      closeModalSelector: '#close-modal',
      retryStatusSelector: '#retry-status',
      connectionStatusSelector: '#conn-status',
      uploadBtnLabel: '开始上传',
      loginUrl: '/login.html'
    });
    }
  </script>
</body>
</html>
