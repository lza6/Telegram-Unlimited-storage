# 开发模式叠加：Volume 挂载 backend 源码 + uvicorn --reload 热重载
# 镜像只在首次（或 requirements.txt / Dockerfile 变更）时 build 一次
#
# 由 .env 的 COMPOSE_FILE 自动叠加；或 docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 改 deploy/web / docs → 秒级生效（Volume 直读）
# 改 backend/app/*.py → uvicorn --reload 自动重启（无需 docker build）
# 改 requirements.txt / Dockerfile → docker compose ... up -d --build

services:
  telegram-drive-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      pull: false
    image: telegram-drive-api:dev
    container_name: telegram-drive-api
    restart: unless-stopped
    ports:
      - "${PORT:-1334}:${PORT:-1334}"
    volumes:
      # Python 源码实时映射（改 .py 即热重载）
      - ./backend/app:/app/backend/app
      # 静态资源秒级更新
      - ./deploy/web:/app/deploy/web
      - ./docs:/app/docs
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/deploy/web
      DOCS_DIR: /app/docs
      BIND_HOST: 0.0.0.0
      PORT: ${PORT:-1334}
