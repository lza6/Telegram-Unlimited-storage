services:
  telegram-drive-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      pull: false
      args:
        PYTHON_VERSION: "3.11-slim-bookworm"
        BUILDKIT_INLINE_CACHE: "1"
    image: telegram-drive-api:local
    container_name: telegram-drive-api
    restart: unless-stopped
    ports:
      # Keep plaintext HTTP local; put TLS termination in a reverse proxy when publishing.
      - "127.0.0.1:${PORT:-1334}:${PORT:-1334}"
    volumes:
      - ./data:/data
      - ./deploy/web:/app/deploy/web:ro
      - ./docs:/app/docs:ro
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/deploy/web
      DOCS_DIR: /app/docs
      # Container listens on its network interface; the host mapping above stays loopback-only.
      BIND_HOST: 0.0.0.0
      PORT: ${PORT:-1334}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:1334/health/live',timeout=3).status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
