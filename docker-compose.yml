services:
  telegram-drive-api:
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
      cache_from:
        - telegram-drive-api:local
        - telegram-drive-api:builder
      args:
        RUST_VERSION: "1.85-bookworm"
        DEBIAN_VERSION: "bookworm-slim"
        BUILDKIT_INLINE_CACHE: "1"
    image: telegram-drive-api:local
    container_name: telegram-drive-api
    restart: unless-stopped
    ports:
      - "${PORT:-1334}:${PORT:-1334}"
    volumes:
      - ./data:/data
      - ./deploy/web:/app/deploy/web:ro
      - ./docs:/app/docs:ro
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/deploy/web
      DOCS_DIR: /app/docs
      BIND_HOST: 0.0.0.0
      PORT: ${PORT:-1334}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${PORT:-1334}/api/v1/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
